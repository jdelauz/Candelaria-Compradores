<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedlot La Candelaria · Compradores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f9f4;
      --bg-surface: #ffffff;
      --text-primary: #1a3a2a;
      --text-body: #4a5568;
      --text-muted: #6b7280;
      --border: #d1d5db;
      --accent-gold: #c49a1a;
      --unit-primary: #2d6a4f;
      --state-negative: #dc2626;
      --state-negative-bg: #fee2e2;
      --serif: 'Libre Baskerville', Georgia, serif;
      --sans: 'Work Sans', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--sans);
      color: var(--text-body);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      background: var(--bg-surface);
      width: 100%;
      max-width: 420px;
      border: 1px solid #e8e4dd;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .card-header {
      background: #111;
      padding: 20px 24px;
      border-bottom: 3px solid var(--accent-gold);
    }
    .card-header .unidad {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,.5);
    }
    .card-header .titulo {
      font-family: var(--serif);
      font-size: 18px;
      color: #fff;
      margin-top: 4px;
    }
    .card-body { padding: 28px 24px; }
    .section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }
    .section-label .bar {
      width: 20px; height: 2px; background: var(--accent-gold); flex-shrink: 0;
    }
    .section-label span {
      font-size: 10px; font-weight: 800; letter-spacing: 2px;
      text-transform: uppercase; color: var(--accent-gold);
    }
    h1.title-md {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 20px;
      color: var(--text-primary);
      margin: 0 0 20px 0;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
      margin-top: 16px;
    }
    label:first-of-type { margin-top: 0; }
    input[type="text"], input[type="email"], input[type="tel"], input[type="date"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      font-family: var(--sans);
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      color: var(--text-primary);
    }
    input:focus { outline: none; border-color: var(--unit-primary); }
    input::placeholder, textarea::placeholder { color: var(--text-muted); opacity: 1; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--sans);
      color: #fff;
      background: var(--unit-primary);
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    p.body-text { font-size: 14px; line-height: 1.6; color: var(--text-body); }
    .msg {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 4px;
      margin-top: 16px;
    }
    .msg.error { background: var(--state-negative-bg); color: var(--state-negative); }
    .msg.ok { background: #dcfce7; color: #1a6b3a; }
    .link-box {
      margin-top: 16px;
      padding: 14px;
      background: #f0ede8;
      border-radius: 4px;
      font-size: 13px;
      word-break: break-all;
      color: var(--text-primary);
    }
    .center { text-align: center; }
    .icon { font-size: 40px; margin-bottom: 12px; }
    .oculto { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="unidad">Feedlot La Candelaria</div>
      <div class="titulo">Circuito de Compradores</div>
    </div>
    <div class="card-body" id="card-body">
      <div class="center"><p class="body-text">Cargando…</p></div>
    </div>
  </div>

  <script>
    // ==================== CONFIGURACIÓN ====================
    var API_URL = 'https://script.google.com/macros/s/AKfycby-IuldRAFhEjS6OVX8av_0flXFnGSzAa4DH-uel6gcHKBbw1sW8QRFKRVzatPIROHT6A/exec';

    // ==================== HELPERS DE API ====================
    function apiGet(params) {
      var qs = new URLSearchParams(params).toString();
      return fetch(API_URL + '?' + qs).then(function (r) { return r.json(); });
    }

    function apiPost(action, data) {
      var body = Object.assign({ action: action }, data);
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita el preflight de CORS
        body: JSON.stringify(body)
      }).then(function (r) { return r.json(); });
    }

    // ==================== RENDER ====================
    var cardBody = document.getElementById('card-body');

    function renderRegistro() {
      cardBody.innerHTML =
        '<div id="paso-registro">' +
          '<div class="section-label"><div class="bar"></div><span>Alta de comprador</span></div>' +
          '<h1 class="title-md">Registrate para empezar</h1>' +
          '<label for="nombre">Nombre y apellido</label>' +
          '<input type="text" id="nombre" placeholder="Ej: Juan Pérez">' +
          '<label for="empresa">Empresa / Consignataria</label>' +
          '<input type="text" id="empresa" placeholder="Ej: Consignataria Rural SA">' +
          '<label for="email">Mail</label>' +
          '<input type="email" id="email" placeholder="tu@mail.com">' +
          '<button id="btn-registrar">Enviar código de verificación</button>' +
          '<div id="msg-registro"></div>' +
        '</div>';
      document.getElementById('btn-registrar').addEventListener('click', enviarRegistro);
    }

    function renderCodigo() {
      cardBody.innerHTML =
        '<div id="paso-codigo">' +
          '<div class="section-label"><div class="bar"></div><span>Verificación</span></div>' +
          '<h1 class="title-md">Ingresá el código</h1>' +
          '<p class="body-text">Te lo mandamos por mail. Puede tardar un minuto en llegar.</p>' +
          '<label for="codigo">Código de 6 dígitos</label>' +
          '<input type="text" id="codigo" maxlength="6" inputmode="numeric" placeholder="000000">' +
          '<button id="btn-verificar">Confirmar</button>' +
          '<div id="msg-codigo"></div>' +
        '</div>';
      document.getElementById('btn-verificar').addEventListener('click', verificar);
    }

    function renderFinal(link) {
      cardBody.innerHTML =
        '<div class="section-label"><div class="bar"></div><span>Listo</span></div>' +
        '<h1 class="title-md">Cuenta verificada</h1>' +
        '<p class="body-text">Guardá este link personal — lo vas a usar siempre para acceder, sin pedir código de nuevo. También te lo mandamos por mail.</p>' +
        '<div class="link-box">' + link + '</div>' +
        '<p class="body-text">Un administrador todavía tiene que habilitar tu cuenta. Te avisamos por mail apenas esté lista.</p>';
    }

    function renderCentro(icono, titulo, texto) {
      cardBody.innerHTML =
        '<div class="center">' +
          '<div class="icon">' + icono + '</div>' +
          '<h1 class="title-md">' + titulo + '</h1>' +
          '<p class="body-text">' + texto + '</p>' +
        '</div>';
    }

    var tokenActual = '';
    var nombreActual = '';
    var consignatariosActuales = [];
    var destinosActuales = ['SIN DESIGNAR'];
    var origenesActuales = [];
    var filasCategoria = 0;

    function renderHome(nombre) {
      cardBody.innerHTML =
        '<div class="section-label"><div class="bar"></div><span>Menú</span></div>' +
        '<h1 class="title-md">Hola ' + nombre + '</h1>' +
        '<button id="btn-cierre">Cierre de negocio</button>' +
        '<button id="btn-carga" style="margin-top:10px;background:transparent;color:var(--unit-primary);border:1px solid var(--unit-primary);">Informe de carga</button>';
      document.getElementById('btn-cierre').addEventListener('click', function () {
        renderCentro('⏳', 'Un momento', 'Cargando el formulario...');
        apiGet({ action: 'parametros' }).then(function (res) {
          destinosActuales = (res.ok && res.destinos && res.destinos.length) ? res.destinos : ['SIN DESIGNAR'];
          origenesActuales = (res.ok && res.origenes) ? res.origenes : [];
          renderFormCierre();
        }).catch(function () {
          destinosActuales = ['SIN DESIGNAR'];
          origenesActuales = [];
          renderFormCierre();
        });
      });
      document.getElementById('btn-carga').addEventListener('click', function () {
        renderCentro('⏳', 'Un momento', 'Buscando tus negocios pendientes...');
        apiGet({ action: 'negociosPendientes', token: tokenActual }).then(function (res) {
          if (!res.ok) {
            renderCentro('⚠️', 'No se pudo continuar', res.error || 'Ocurrió un error.');
            return;
          }
          negociosPendientesActuales = res.negocios || [];
          renderListaNegociosPendientes();
        }).catch(function () {
          renderCentro('⚠️', 'Error de conexión', 'Probá de nuevo en un momento.');
        });
      });
    }

    var negociosPendientesActuales = [];
    var negocioSeleccionadoActual = null;

    function renderListaNegociosPendientes() {
      if (negociosPendientesActuales.length === 0) {
        cardBody.innerHTML =
          '<div class="center">' +
            '<div class="icon">📋</div>' +
            '<h1 class="title-md">Sin negocios pendientes</h1>' +
            '<p class="body-text">No tenés cierres de negocio esperando informe de carga.</p>' +
          '</div>' +
          '<button id="btn-volver-inicio-2" style="margin-top:10px;background:transparent;color:var(--unit-primary);border:1px solid var(--unit-primary);">Volver al inicio</button>';
        document.getElementById('btn-volver-inicio-2').addEventListener('click', function () { renderHome(nombreActual); });
        return;
      }

      var opciones = negociosPendientesActuales.map(function (n, idx) {
        var resumenCat = n.categorias.map(function (c) { return c.categoria + ': ' + c.cantidad; }).join(', ');
        var etiqueta = n.semana + ' · ' + n.lugarCarga + ' → ' + n.destino + ' (' + resumenCat + ')';
        return '<option value="' + idx + '">' + etiqueta + '</option>';
      }).join('');

      cardBody.innerHTML =
        '<div class="section-label"><div class="bar"></div><span>Informe de carga</span></div>' +
        '<h1 class="title-md">Elegí el negocio</h1>' +
        '<select id="negocio-select" style="width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--border);border-radius:4px;">' + opciones + '</select>' +
        '<button id="btn-siguiente-negocio">Continuar</button>';

      document.getElementById('btn-siguiente-negocio').addEventListener('click', function () {
        var idx = Number(document.getElementById('negocio-select').value);
        renderFormInforme(negociosPendientesActuales[idx]);
      });
    }

    function filaCategoriaInformeHtml_(cat, cantidadOriginal, precioOriginal) {
      return (
        '<div class="fila-cat-informe" data-cat="' + cat + '" style="border:1px solid var(--border);border-radius:4px;padding:10px;margin-top:10px;">' +
          '<label style="margin-top:0;">' + cat + ' — Cantidad</label>' +
          '<input type="text" class="informe-cantidad" inputmode="numeric" value="' + cantidadOriginal + '">' +
          '<div class="informe-kilos-cat" style="display:none;margin-top:8px;">' +
            '<label style="margin-top:0;font-size:11px;">Kilos brutos (' + cat + ')</label>' +
            '<input type="text" class="informe-kilos" inputmode="decimal" placeholder="Ej: 45000">' +
          '</div>' +
          '<label style="margin-top:8px;font-size:11px;">Precio $/kg' + (precioOriginal ? ' (pactado: $' + precioOriginal + ')' : '') + '</label>' +
          '<input type="text" class="informe-precio" inputmode="decimal" placeholder="Ej: 2500" value="' + (precioOriginal || '') + '">' +
        '</div>'
      );
    }

    function renderFormInforme(negocio) {
      negocioSeleccionadoActual = negocio;
      renderCentro('⏳', 'Un momento', 'Buscando el precio pactado...');

      apiGet({ action: 'precioOriginal', token: tokenActual, idNegocio: negocio.idNegocio })
        .then(function (res) {
          var precios = (res.ok && res.precios) ? res.precios : {};
          renderFormInformeConPrecios_(negocio, precios);
        })
        .catch(function () {
          renderFormInformeConPrecios_(negocio, {});
        });
    }

    function renderFormInformeConPrecios_(negocio, precios) {
      var filasCategorias = negocio.categorias.map(function (c) {
        return filaCategoriaInformeHtml_(c.categoria, c.cantidad, precios[c.categoria]);
      }).join('');

      cardBody.innerHTML =
        '<div class="section-label"><div class="bar"></div><span>Informe de carga</span></div>' +
        '<h1 class="title-md">' + negocio.consignatario + '</h1>' +
        '<p class="body-text">' + negocio.semana + ' · ' + negocio.lugarCarga + ' → ' + negocio.destino + '</p>' +
        '<label>Cantidad, precio y kilos por categoría</label>' +
        '<div id="categorias-informe-container">' + filasCategorias + '</div>' +
        '<label style="margin-top:16px;">¿Cómo cargás los kilos brutos?</label>' +
        '<select id="modo-kilos" style="width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--border);border-radius:4px;">' +
          '<option value="total">Total de la tropa</option>' +
          '<option value="categoria">Por categoría</option>' +
        '</select>' +
        '<div id="kilos-total-container">' +
          '<label for="kilosBrutosTotal">Kilos brutos totales</label>' +
          '<input type="text" id="kilosBrutosTotal" inputmode="decimal" placeholder="Ej: 45000">' +
        '</div>' +
        '<label for="desbaste">Desbaste (%)</label>' +
        '<input type="text" id="desbaste" inputmode="decimal" placeholder="Ej: 4">' +
        '<div class="msg ok" id="kilos-netos-preview" style="display:none;"></div>' +
        '<label for="observaciones">Observaciones</label>' +
        '<textarea id="observaciones" rows="2" style="width:100%;padding:12px 14px;font-size:14px;border:1px solid var(--border);border-radius:4px;font-family:var(--sans);color:var(--text-primary);resize:vertical;"></textarea>' +
        '<label for="adjunto">Adjuntar imagen o PDF (opcional)</label>' +
        '<input type="file" id="adjunto" accept="image/*,application/pdf">' +
        '<button id="btn-guardar-informe">Confirmar informe</button>' +
        '<div id="msg-informe"></div>';


      document.getElementById('modo-kilos').addEventListener('change', function (ev) {
        var esPorCategoria = (ev.target.value === 'categoria');
        document.getElementById('kilos-total-container').style.display = esPorCategoria ? 'none' : 'block';
        document.querySelectorAll('.informe-kilos-cat').forEach(function (div) {
          div.style.display = esPorCategoria ? 'block' : 'none';
        });
        actualizarPreviewKilosNetos();
      });

      cardBody.querySelectorAll('input').forEach(function (input) {
        input.addEventListener('input', actualizarPreviewKilosNetos);
      });

      document.getElementById('btn-guardar-informe').addEventListener('click', guardarInforme);
    }

    function actualizarPreviewKilosNetos() {
      var modo = document.getElementById('modo-kilos').value;
      var kilosBrutos = 0;
      if (modo === 'categoria') {
        document.querySelectorAll('.informe-kilos').forEach(function (input) {
          kilosBrutos += Number(input.value) || 0;
        });
      } else {
        kilosBrutos = Number(document.getElementById('kilosBrutosTotal').value) || 0;
      }
      var desbaste = Number(document.getElementById('desbaste').value) || 0;
      var preview = document.getElementById('kilos-netos-preview');
      if (kilosBrutos > 0) {
        var kilosNetos = Math.round(kilosBrutos * (1 - desbaste / 100) * 100) / 100;
        preview.style.display = 'block';
        preview.textContent = 'Kilos netos estimados: ' + kilosNetos + ' kg';
      } else {
        preview.style.display = 'none';
      }
    }

    function guardarInforme() {
      var categorias = [];
      document.querySelectorAll('.fila-cat-informe').forEach(function (fila) {
        var cat = fila.getAttribute('data-cat');
        var cantidad = fila.querySelector('.informe-cantidad').value;
        var kilosInput = fila.querySelector('.informe-kilos');
        var precioInput = fila.querySelector('.informe-precio');
        categorias.push({
          categoria: cat,
          cantidad: cantidad,
          kilosBrutos: kilosInput ? kilosInput.value : '',
          precioFinal: precioInput ? precioInput.value : ''
        });
      });

      var datosBase = {
        token: tokenActual,
        idNegocio: negocioSeleccionadoActual.idNegocio,
        categorias: categorias,
        modoKilos: document.getElementById('modo-kilos').value,
        kilosBrutosTotal: document.getElementById('kilosBrutosTotal').value,
        desbaste: document.getElementById('desbaste').value,
        observaciones: document.getElementById('observaciones').value
      };

      var btn = document.getElementById('btn-guardar-informe');
      var msg = document.getElementById('msg-informe');
      msg.innerHTML = '';
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      var archivo = document.getElementById('adjunto').files[0];

      function enviar(datos) {
        apiPost('informarCarga', datos)
          .then(function (res) {
            btn.disabled = false;
            btn.textContent = 'Confirmar informe';
            if (res.ok) {
              renderConfirmacionInforme();
            } else {
              msg.innerHTML = '<div class="msg error">' + res.error + '</div>';
            }
          })
          .catch(function () {
            btn.disabled = false;
            btn.textContent = 'Confirmar informe';
            msg.innerHTML = '<div class="msg error">Ocurrió un error de conexión. Probá de nuevo.</div>';
          });
      }

      if (!archivo) {
        enviar(datosBase);
        return;
      }

      var lector = new FileReader();
      lector.onload = function () {
        var base64Completo = lector.result; // "data:<mime>;base64,AAAA..."
        var base64Puro = base64Completo.split(',')[1];
        datosBase.adjunto = {
          nombreArchivo: archivo.name,
          tipoArchivo: archivo.type,
          datosBase64: base64Puro
        };
        enviar(datosBase);
      };
      lector.onerror = function () {
        btn.disabled = false;
        btn.textContent = 'Confirmar informe';
        msg.innerHTML = '<div class="msg error">No se pudo leer el archivo adjunto. Probá de nuevo.</div>';
      };
      lector.readAsDataURL(archivo);
    }

    function renderConfirmacionInforme() {
      cardBody.innerHTML =
        '<div class="center">' +
          '<div class="icon">✅</div>' +
          '<h1 class="title-md">Informe cargado</h1>' +
          '<p class="body-text">Se guardó correctamente y se mandó el mail de confirmación.</p>' +
        '</div>' +
        '<button id="btn-volver-inicio-3" style="margin-top:10px;background:transparent;color:var(--unit-primary);border:1px solid var(--unit-primary);">Volver al inicio</button>';
      document.getElementById('btn-volver-inicio-3').addEventListener('click', function () { renderHome(nombreActual); });
    }

    function filaCategoriaHtml_(id) {
      return (
        '<div class="fila-categoria" data-id="' + id + '" style="border:1px solid var(--border);border-radius:4px;padding:10px;margin-top:10px;">' +
          '<div style="display:flex;gap:8px;align-items:flex-end;">' +
            '<div style="flex:1;">' +
              '<label style="margin-top:0;">Categoría</label>' +
              '<select class="cat-select" style="width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--border);border-radius:4px;">' +
                '<option value="TM">TM</option><option value="NT">NT</option><option value="VQ">VQ</option><option value="TH">TH</option>' +
              '</select>' +
            '</div>' +
            '<div style="flex:1;">' +
              '<label style="margin-top:0;">Cantidad</label>' +
              '<input type="text" class="cat-cantidad" inputmode="numeric" placeholder="Ej: 120">' +
            '</div>' +
            '<button type="button" class="btn-quitar-cat" data-id="' + id + '" style="width:auto;margin-top:0;padding:12px 14px;background:transparent;color:var(--state-negative);border:1px solid var(--state-negative);">✕</button>' +
          '</div>' +
          '<div style="display:flex;gap:8px;margin-top:8px;">' +
            '<div style="flex:1;">' +
              '<label style="margin-top:0;font-size:11px;">Peso prom. kg (opcional)</label>' +
              '<input type="text" class="cat-peso" inputmode="decimal" placeholder="Ej: 380">' +
            '</div>' +
            '<div style="flex:1;">' +
              '<label style="margin-top:0;font-size:11px;">Precio $/kg (opcional)</label>' +
              '<input type="text" class="cat-precio" inputmode="decimal" placeholder="Ej: 2500">' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }

    function agregarFilaCategoria() {
      filasCategoria++;
      var cont = document.getElementById('categorias-container');
      var div = document.createElement('div');
      div.innerHTML = filaCategoriaHtml_(filasCategoria);
      cont.appendChild(div.firstChild);
      cont.querySelector('.btn-quitar-cat[data-id="' + filasCategoria + '"]').addEventListener('click', quitarFilaCategoria);
    }

    function quitarFilaCategoria(ev) {
      var id = ev.currentTarget.getAttribute('data-id');
      var cont = document.getElementById('categorias-container');
      var fila = cont.querySelector('.fila-categoria[data-id="' + id + '"]');
      if (cont.querySelectorAll('.fila-categoria').length > 1) {
        fila.remove();
      }
    }

    function renderFormCierre() {
      var opcionesConsignatario = consignatariosActuales.map(function (c) {
        return '<option value="' + c + '">' + c + '</option>';
      }).join('');
      var opcionesDestino = destinosActuales.map(function (d) {
        return '<option value="' + d + '">' + d + '</option>';
      }).join('');
      var hoy = new Date().toISOString().substring(0, 10);
      filasCategoria = 0;

      cardBody.innerHTML =
        '<div class="section-label"><div class="bar"></div><span>Cierre de negocio</span></div>' +
        '<h1 class="title-md">Cargar cierre</h1>' +
        '<label>Categorías y cantidades</label>' +
        '<div id="categorias-container"></div>' +
        '<button type="button" id="btn-agregar-cat" style="margin-top:8px;background:transparent;color:var(--unit-primary);border:1px dashed var(--unit-primary);">+ Agregar otra categoría</button>' +
        '<label for="consignatario-select">Consignatario</label>' +
        '<select id="consignatario-select" style="width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--border);border-radius:4px;">' +
          opcionesConsignatario +
          '<option value="__nuevo__">+ Nueva consignataria...</option>' +
        '</select>' +
        '<input type="text" id="consignatario-nuevo" placeholder="Escribí la nueva consignataria" style="display:none;margin-top:8px;">' +
        '<label for="lugarCarga">Lugar de carga</label>' +
        '<input type="text" id="lugarCarga" list="lista-origenes" placeholder="Origen" autocomplete="off">' +
        '<datalist id="lista-origenes">' + origenesActuales.map(function (o) { return '<option value="' + o + '">'; }).join('') + '</datalist>' +
        '<label for="destino">Destino</label>' +
        '<select id="destino" style="width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--border);border-radius:4px;">' + opcionesDestino + '</select>' +
        '<label for="diaCierre">Día de cierre</label>' +
        '<input type="date" id="diaCierre" value="' + hoy + '">' +
        '<label for="plazoPago">Plazo de pago</label>' +
        '<select id="plazoPago" style="width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--border);border-radius:4px;">' +
          '<option value="Contado">Contado</option>' +
          '<option value="30 días">30 días</option>' +
          '<option value="45 días">45 días</option>' +
          '<option value="60 días">60 días</option>' +
          '<option value="30 y 60 días">30 y 60 días</option>' +
          '<option value="30, 60 y 90 días">30, 60 y 90 días</option>' +
          '<option value="30, 60, 90 y 120 días">30, 60, 90 y 120 días</option>' +
          '<option value="__otro__">Otro...</option>' +
        '</select>' +
        '<input type="text" id="plazoPago-otro" placeholder="Detallá el plazo" style="display:none;margin-top:8px;">' +
        '<label for="detalle">Detalle / condiciones (opcional)</label>' +
        '<textarea id="detalle" rows="2" placeholder="Ej: $X hasta XX kg, o tabla $X hasta XX kg a morir..." style="width:100%;padding:12px 14px;font-size:14px;border:1px solid var(--border);border-radius:4px;font-family:var(--sans);color:var(--text-primary);resize:vertical;"></textarea>' +
        '<button id="btn-guardar-cierre">Confirmar cierre</button>' +
        '<div id="msg-cierre"></div>';

      agregarFilaCategoria();
      document.getElementById('btn-agregar-cat').addEventListener('click', agregarFilaCategoria);
      document.getElementById('btn-guardar-cierre').addEventListener('click', guardarCierre);
      document.getElementById('consignatario-select').addEventListener('change', function (ev) {
        document.getElementById('consignatario-nuevo').style.display = (ev.target.value === '__nuevo__') ? 'block' : 'none';
      });
      var selInicial = document.getElementById('consignatario-select');
      document.getElementById('consignatario-nuevo').style.display = (selInicial.value === '__nuevo__') ? 'block' : 'none';
      document.getElementById('plazoPago').addEventListener('change', function (ev) {
        document.getElementById('plazoPago-otro').style.display = (ev.target.value === '__otro__') ? 'block' : 'none';
      });
    }

    function renderConfirmacionCierre() {
      cardBody.innerHTML =
        '<div class="center">' +
          '<div class="icon">✅</div>' +
          '<h1 class="title-md">Negocio cargado</h1>' +
          '<p class="body-text">Se guardó correctamente y se mandó el mail de confirmación.</p>' +
        '</div>' +
        '<button id="btn-otro-cierre">Cargar otro cierre</button>' +
        '<button id="btn-volver-inicio" style="margin-top:10px;background:transparent;color:var(--unit-primary);border:1px solid var(--unit-primary);">Volver al inicio</button>';

      document.getElementById('btn-otro-cierre').addEventListener('click', function () {
        renderCentro('⏳', 'Un momento', 'Cargando el formulario...');
        apiGet({ action: 'parametros' }).then(function (res) {
          destinosActuales = (res.ok && res.destinos && res.destinos.length) ? res.destinos : ['SIN DESIGNAR'];
          origenesActuales = (res.ok && res.origenes) ? res.origenes : [];
          renderFormCierre();
        }).catch(function () {
          destinosActuales = ['SIN DESIGNAR'];
          origenesActuales = [];
          renderFormCierre();
        });
      });
      document.getElementById('btn-volver-inicio').addEventListener('click', function () {
        renderHome(nombreActual);
      });
    }

    function guardarCierre() {
      var categorias = [];
      document.querySelectorAll('.fila-categoria').forEach(function (fila) {
        categorias.push({
          categoria: fila.querySelector('.cat-select').value,
          cantidad: fila.querySelector('.cat-cantidad').value,
          pesoPromedio: fila.querySelector('.cat-peso').value,
          precioPorKg: fila.querySelector('.cat-precio').value
        });
      });

      var selectConsignatario = document.getElementById('consignatario-select');
      var consignatario = (selectConsignatario.value === '__nuevo__')
        ? document.getElementById('consignatario-nuevo').value
        : selectConsignatario.value;

      var selectPlazo = document.getElementById('plazoPago');
      var plazoPago = (selectPlazo.value === '__otro__')
        ? document.getElementById('plazoPago-otro').value
        : selectPlazo.value;

      var datos = {
        token: tokenActual,
        categorias: categorias,
        consignatario: consignatario,
        lugarCarga: document.getElementById('lugarCarga').value,
        destino: document.getElementById('destino').value,
        diaCierre: document.getElementById('diaCierre').value,
        plazoPago: plazoPago,
        detalle: document.getElementById('detalle').value
      };
      var btn = document.getElementById('btn-guardar-cierre');
      var msg = document.getElementById('msg-cierre');
      msg.innerHTML = '';
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      apiPost('cerrarNegocio', datos)
        .then(function (res) {
          btn.disabled = false;
          btn.textContent = 'Confirmar cierre';
          if (res.ok) {
            renderConfirmacionCierre();
          } else {
            msg.innerHTML = '<div class="msg error">' + res.error + '</div>';
          }
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = 'Confirmar cierre';
          msg.innerHTML = '<div class="msg error">Ocurrió un error de conexión. Probá de nuevo.</div>';
        });
    }

    // ==================== ACCIONES ====================
    var emailRegistrado = '';

    function enviarRegistro() {
      var nombre = document.getElementById('nombre').value;
      var empresa = document.getElementById('empresa').value;
      var email = document.getElementById('email').value;
      var btn = document.getElementById('btn-registrar');
      var msg = document.getElementById('msg-registro');
      msg.innerHTML = '';
      btn.disabled = true;
      btn.textContent = 'Enviando...';

      apiPost('registrar', { nombre: nombre, empresa: empresa, email: email })
        .then(function (res) {
          btn.disabled = false;
          btn.textContent = 'Enviar código de verificación';
          if (res.ok) {
            emailRegistrado = res.email;
            renderCodigo();
          } else {
            msg.innerHTML = '<div class="msg error">' + res.error + '</div>';
          }
        })
        .catch(function (err) {
          btn.disabled = false;
          btn.textContent = 'Enviar código de verificación';
          msg.innerHTML = '<div class="msg error">Ocurrió un error de conexión. Probá de nuevo.</div>';
        });
    }

    function verificar() {
      var codigo = document.getElementById('codigo').value;
      var btn = document.getElementById('btn-verificar');
      var msg = document.getElementById('msg-codigo');
      msg.innerHTML = '';
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      apiPost('verificar', { email: emailRegistrado, codigo: codigo })
        .then(function (res) {
          btn.disabled = false;
          btn.textContent = 'Confirmar';
          if (res.ok) {
            renderFinal(res.link);
          } else {
            msg.innerHTML = '<div class="msg error">' + res.error + '</div>';
          }
        })
        .catch(function (err) {
          btn.disabled = false;
          btn.textContent = 'Confirmar';
          msg.innerHTML = '<div class="msg error">Ocurrió un error de conexión. Probá de nuevo.</div>';
        });
    }

    // ==================== INICIO ====================
    (function init() {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');

      if (!token) {
        renderRegistro();
        return;
      }

      apiGet({ action: 'estado', token: token })
        .then(function (res) {
          if (res.mode === 'pendiente_vinculacion') {
            renderCentro('⏳', 'Hola ' + res.nombre, 'Tu cuenta está verificada. Un administrador la va a habilitar en breve para que puedas informar negocios y cargas. Te avisamos por mail.');
          } else if (res.mode === 'home') {
            tokenActual = token;
            nombreActual = res.nombre;
            consignatariosActuales = res.consignatarios || [];
            renderHome(res.nombre);
          } else {
            renderCentro('⚠️', 'Link no válido', 'Este link no corresponde a ninguna cuenta activa. Registrate de nuevo desde el link general que te compartieron.');
          }
        })
        .catch(function () {
          renderCentro('⚠️', 'Error de conexión', 'No pudimos consultar tu cuenta. Probá de nuevo en un momento.');
        });
    })();
  </script>
</body>
</html>
